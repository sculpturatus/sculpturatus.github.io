<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Surveyor Score</title>
<style>
  :root{
    --bg:#0e1116; --panel:#171b22; --panel2:#1e232c; --border:#2b323d;
    --text:#e6e9ef; --muted:#8b94a3; --accent:#4a9eff; --good:#3ecf8e; --bad:#ff6b6b;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh}
  a{color:var(--accent)}
  .wrap{max-width:760px;margin:0 auto;padding:40px 20px}
  h1{font-size:24px;font-weight:600;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:28px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:20px}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em}
  input[type=text],input[type=password],textarea{
    width:100%;background:var(--panel2);border:1px solid var(--border);border-radius:8px;
    color:var(--text);padding:11px 13px;font-size:14px;font-family:inherit}
  textarea{resize:vertical;min-height:52px}
  input:focus,textarea:focus{outline:none;border-color:var(--accent)}
  button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:11px 18px;
    font-size:14px;font-weight:600;cursor:pointer;margin-top:12px}
  button:hover{filter:brightness(1.08)}
  button:disabled{opacity:.5;cursor:default}
  .hint{font-size:12px;color:var(--muted);margin-top:8px}
  .err{color:var(--bad);font-size:13px;margin-top:10px;white-space:pre-wrap}
  /* gate */
  #gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:10}
  #gate .card{width:340px;max-width:90vw;text-align:center}
  #app{display:none}
  /* score result */
  .total{font-size:44px;font-weight:700;margin:6px 0}
  .total small{font-size:18px;color:var(--muted);font-weight:500}
  table{width:100%;border-collapse:collapse;margin-top:14px;font-size:13px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border)}
  th{color:var(--muted);font-weight:500;text-transform:uppercase;font-size:11px;letter-spacing:.04em}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  .bar{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden;min-width:70px}
  .bar>i{display:block;height:100%;background:var(--good)}
  /* dropzone */
  #drop{border:2px dashed var(--border);border-radius:10px;padding:34px 20px;text-align:center;
    color:var(--muted);transition:.15s;cursor:pointer}
  #drop.over{border-color:var(--accent);background:var(--panel2);color:var(--text)}
  #drop strong{color:var(--text)}
  .status{font-size:13px;margin-top:12px;color:var(--muted)}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid var(--border);
    border-top-color:var(--accent);border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes s{to{transform:rotate(360deg)}}
  button.ghost{background:transparent;border:1px solid var(--accent);color:var(--accent)}
  .preview-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;flex-wrap:wrap}
  .preview-head .meta{font-size:12px;color:var(--muted)}
  .scroll{overflow-x:auto;margin-top:10px;border:1px solid var(--border);border-radius:8px}
  table.grid{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}
  table.grid th,table.grid td{padding:7px 10px;border-bottom:1px solid var(--border);text-align:right;font-variant-numeric:tabular-nums}
  table.grid th{position:sticky;top:0;background:var(--panel2);color:var(--muted);font-weight:500;text-transform:none;letter-spacing:0}
  table.grid td:first-child,table.grid th:first-child,
  table.grid td.txt,table.grid th.txt{text-align:left}
  table.grid tr.bad td{color:var(--bad)}
  table.grid tr:last-child td{border-bottom:0}
</style>
</head>
<body>

<!-- ===== password gate ===== -->
<div id="gate">
  <div class="card">
    <h1 style="margin-bottom:14px">Surveyor Score</h1>
    <label style="text-align:left">Password</label>
    <input type="password" id="pw" autocomplete="off" onkeydown="if(event.key==='Enter')unlock()">
    <button onclick="unlock()" id="pwBtn" style="width:100%">Unlock</button>
    <div class="err" id="pwErr"></div>
  </div>
</div>

<!-- ===== app ===== -->
<div id="app">
  <div class="wrap">
    <h1>Surveyor Score</h1>
    <div class="sub">Multi-parameter desirability score (max 5.0) &middot; MW, Fsp&sup3;, cLogP, tPSA, information density</div>

    <!-- single SMILES -->
    <div class="card">
      <label>Single SMILES</label>
      <textarea id="smi" placeholder="Paste a SMILES string, e.g. CC(=O)Oc1ccccc1C(=O)O" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();scoreOne()}"></textarea>
      <button onclick="scoreOne()" id="scoreBtn">Score</button>
      <div class="err" id="oneErr"></div>
      <div id="result"></div>
    </div>

    <!-- batch CSV -->
    <div class="card">
      <label>Batch &mdash; CSV file</label>
      <div id="drop">
        <div><strong>Drag &amp; drop a CSV</strong> here, or click to choose</div>
        <div class="hint">Needs a <code>smiles</code> column (else the first column is used). You get a CSV back with every score.</div>
      </div>
      <input type="file" id="fileInput" accept=".csv" style="display:none">
      <div class="status" id="batchStatus"></div>
      <div id="batchPreview"></div>
    </div>
  </div>
</div>

<script>
const API = "https://api.sculpturatus.com";
let PW = "";

function authHeaders(extra){ return Object.assign({"X-Surveyor-Password": PW}, extra||{}); }

async function unlock(){
  const pw = document.getElementById("pw").value;
  const btn = document.getElementById("pwBtn"), err = document.getElementById("pwErr");
  err.textContent = ""; btn.disabled = true; btn.textContent = "Checking…";
  try{
    const r = await fetch(API + "/surveyor/auth", { headers: {"X-Surveyor-Password": pw} });
    if(r.ok){ PW = pw; document.getElementById("gate").style.display="none";
              document.getElementById("app").style.display="block"; }
    else if(r.status === 401){ err.textContent = "Wrong password."; }
    else { err.textContent = "Server error (" + r.status + ")."; }
  }catch(e){ err.textContent = "Cannot reach server. " + e.message; }
  btn.disabled = false; btn.textContent = "Unlock";
}

function pct(v){ return Math.round((v/1)*100); }

function renderResult(res){
  const c = res.components, d = res.descriptors;
  const rows = [
    ["MW",            c.mw,           d.mw],
    ["Fraction sp³", c.fsp3,     d.fsp3],
    ["cLogP",         c.clogp,        d.clogp],
    ["tPSA",          c.tpsa,         d.tpsa],
    ["Info density",  c.info_density, d.info_density + " (Böttcher " + d.bottcher + ")"],
  ];
  let html = '<div class="total">' + res.surveyor_score + '<small> / 5.0</small></div>';
  html += '<table><thead><tr><th>Parameter</th><th>Value</th><th>Desirability</th><th></th></tr></thead><tbody>';
  for(const [name,score,val] of rows){
    html += '<tr><td>'+name+'</td><td class="num">'+val+'</td><td class="num">'+score.toFixed(2)+'</td>'
          + '<td><div class="bar"><i style="width:'+pct(score)+'%"></i></div></td></tr>';
  }
  html += '</tbody></table>';
  document.getElementById("result").innerHTML = html;
}

async function scoreOne(){
  const smi = document.getElementById("smi").value.trim();
  const btn = document.getElementById("scoreBtn"), err = document.getElementById("oneErr");
  err.textContent = ""; document.getElementById("result").innerHTML = "";
  if(!smi){ err.textContent = "Enter a SMILES string."; return; }
  btn.disabled = true; btn.textContent = "Scoring…";
  try{
    const r = await fetch(API + "/surveyor/score", {
      method:"POST", headers: authHeaders({"Content-Type":"application/json"}),
      body: JSON.stringify({ smiles: smi })
    });
    if(r.ok){ renderResult(await r.json()); }
    else { const j = await r.json().catch(()=>({})); err.textContent = j.detail || ("Error " + r.status); }
  }catch(e){ err.textContent = "Request failed. " + e.message; }
  btn.disabled = false; btn.textContent = "Score";
}

/* ---- batch ---- */
const drop = document.getElementById("drop");
const fileInput = document.getElementById("fileInput");
drop.addEventListener("click", ()=>fileInput.click());
fileInput.addEventListener("change", e=>{ if(e.target.files[0]) sendCsv(e.target.files[0]); });
["dragenter","dragover"].forEach(ev=>drop.addEventListener(ev, e=>{e.preventDefault();drop.classList.add("over");}));
["dragleave","drop"].forEach(ev=>drop.addEventListener(ev, e=>{e.preventDefault();drop.classList.remove("over");}));
drop.addEventListener("drop", e=>{ const f=e.dataTransfer.files[0]; if(f) sendCsv(f); });

const PREVIEW_ROWS = 15;

// minimal CSV parser (handles quoted fields and commas/newlines inside quotes)
function parseCsv(text){
  const rows = []; let row = [], field = "", q = false;
  for(let i=0;i<text.length;i++){
    const ch = text[i];
    if(q){
      if(ch === '"'){ if(text[i+1] === '"'){ field += '"'; i++; } else q = false; }
      else field += ch;
    } else {
      if(ch === '"') q = true;
      else if(ch === ',') { row.push(field); field = ""; }
      else if(ch === '\n'){ row.push(field); rows.push(row); row = []; field = ""; }
      else if(ch === '\r'){ /* skip */ }
      else field += ch;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.length > 1 || (r.length === 1 && r[0] !== ""));
}

function renderPreview(text, name, blobUrl){
  const rows = parseCsv(text);
  const prev = document.getElementById("batchPreview");
  if(!rows.length){ prev.innerHTML = ""; return; }
  const header = rows[0];
  const body = rows.slice(1);
  const errIdx = header.indexOf("error");
  const smiIdx = header.findIndex(h => h.toLowerCase() === "smiles");

  const total = body.length;
  const failed = errIdx >= 0 ? body.filter(r => (r[errIdx]||"").trim() !== "").length : 0;
  const shown = body.slice(0, PREVIEW_ROWS);

  let html = '<div class="preview-head">'
    + '<div class="meta">'+total+' rows scored'
    + (failed ? ' &middot; <span style="color:var(--bad)">'+failed+' failed</span>' : '')
    + (total > PREVIEW_ROWS ? ' &middot; showing first '+PREVIEW_ROWS : '')
    + '</div>'
    + '<button class="ghost" id="dlBtn">Download full CSV</button></div>';

  html += '<div class="scroll"><table class="grid"><thead><tr>';
  header.forEach((h,i) => { const txt = (i === smiIdx || i === 0 || i === errIdx); html += '<th'+(txt?' class="txt"':'')+'>'+esc(h)+'</th>'; });
  html += '</tr></thead><tbody>';
  shown.forEach(r => {
    const isBad = errIdx >= 0 && (r[errIdx]||"").trim() !== "";
    html += '<tr'+(isBad?' class="bad"':'')+'>';
    header.forEach((h,i) => { const txt = (i === smiIdx || i === 0 || i === errIdx); html += '<td'+(txt?' class="txt"':'')+'>'+esc(r[i]!==undefined?r[i]:"")+'</td>'; });
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  prev.innerHTML = html;

  document.getElementById("dlBtn").onclick = () => {
    const a = document.createElement("a"); a.href = blobUrl; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
  };
}

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

async function sendCsv(file){
  const status = document.getElementById("batchStatus");
  const prev = document.getElementById("batchPreview");
  prev.innerHTML = "";
  if(!/\.csv$/i.test(file.name)){ status.innerHTML = '<span class="err">Please choose a .csv file.</span>'; return; }
  status.innerHTML = '<span class="spin"></span>Scoring '+file.name+'… (large files take a moment)';
  try{
    const fd = new FormData(); fd.append("file", file);
    const r = await fetch(API + "/surveyor/batch", { method:"POST", headers: authHeaders(), body: fd });
    if(!r.ok){ const j = await r.json().catch(()=>({})); status.innerHTML = '<span class="err">'+(j.detail||("Error "+r.status))+'</span>'; return; }
    const blob = await r.blob();
    const text = await blob.text();
    let name = "scored.csv";
    const cd = r.headers.get("Content-Disposition");
    if(cd){ const m = cd.match(/filename="?([^"]+)"?/); if(m) name = m[1]; }
    const url = URL.createObjectURL(blob);
    status.textContent = "Done — preview below.";
    renderPreview(text, name, url);
  }catch(e){ status.innerHTML = '<span class="err">Upload failed. '+e.message+'</span>'; }
  fileInput.value = "";
}
</script>
</body>
</html>
